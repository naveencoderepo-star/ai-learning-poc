[project]
name = "ai-learning-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naveen Kumar", email = "naveencoderepo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "mcp[cli]>=2.3.0",
    "ollama>=0.6.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-learning-poc = "ai_learning_poc:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
